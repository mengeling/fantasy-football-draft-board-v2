[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.14.0"
anyhow = "1.0.104"
async-trait = "0.1.91"
chrono = "0.4.45"
dotenvy = "0.15.7"
env_logger = "0.11.11"
futures = "0.3.33"
headless_chrome = "1.0.22"
log = "0.4.33"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["blocking"] }
round = "0.1.2"
scraper = "0.27.0"
select = "0.6.1"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "time", "chrono"] }
strum = { version = "0.28.0", features = ["derive"] }
sxd-xpath = "0.4.2"
time = { version = "0.3.54", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
xmltree = "0.12.0"
